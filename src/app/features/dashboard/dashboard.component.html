<div class="min-h-screen bg-dark-950 bg-mesh flex" dir="rtl">

  <!-- ── Mobile Overlay ─────────────────────────────────── -->
  <div *ngIf="isSidebarOpen() && isMobile()" (click)="toggleSidebar()"
    class="fixed inset-0 bg-black/70 z-20 lg:hidden backdrop-blur-sm animate-fade-in">
  </div>

  <!-- ── Sidebar ────────────────────────────────────────── -->
  <aside
    class="lg:sticky fixed top-0 bottom-0 right-0 z-30 flex flex-col h-screen transition-all duration-300 ease-in-out flex-shrink-0"
    [class.w-72]="isSidebarOpen()" [class.w-20]="!isSidebarOpen() && !isMobile()"
    [class.translate-x-full]="!isSidebarOpen() && isMobile()" [class.translate-x-0]="isSidebarOpen() || !isMobile()"
    style="background: linear-gradient(180deg, #0d1526 0%, #070d1a 100%); border-left: 1px solid rgba(51,65,85,0.5);">
    <!-- Logo -->
    <div class="h-16 lg:h-20 flex items-center px-4 overflow-hidden flex-shrink-0"
      style="border-bottom: 1px solid rgba(51,65,85,0.4);">
      <div
        class="w-9 h-9 min-w-[36px] rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-lg shadow-primary-900/50">
        <img src="assets/logo.png" alt="كُتّاب" class="w-6 h-6 object-contain"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'">
        <span class="text-white font-black text-sm" style="display:none">ك</span>
      </div>
      <div *ngIf="isSidebarOpen()" class="mr-3 animate-fade-in">
        <div class="text-lg font-black text-white leading-tight">كُتّاب</div>
        <div class="text-[10px] text-primary-400 font-medium leading-tight">نظام إدارة المركز</div>
      </div>
    </div>

    <!-- Nav -->
    <nav class="p-3 space-y-0.5 flex-1 overflow-y-auto mt-2">
      <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="is-active"
        class="nav-link group flex items-center p-3 rounded-xl text-dark-400 transition-all duration-200 border border-transparent relative overflow-hidden">
        <!-- Active indicator glow -->
        <div class="nav-glow absolute inset-0 rounded-xl opacity-0 transition-opacity duration-200"
          style="background: linear-gradient(135deg, rgba(74,222,128,0.08) 0%, transparent 100%);"></div>

        <div class="w-5 h-5 flex items-center justify-center flex-shrink-0 relative z-10">
          <svg *ngIf="item.icon === 'home'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
          </svg>
          <svg *ngIf="item.icon === 'book'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          <svg *ngIf="item.icon === 'users'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <svg *ngIf="item.icon === 'check-square'" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
          <svg *ngIf="item.icon === 'file-text'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          <svg *ngIf="item.icon === 'calendar'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          <svg *ngIf="item.icon === 'cash'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <svg *ngIf="item.icon === 'shield-lock'" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016zM12 9v2m0 4h.01" />
          </svg>
        </div>

        <span *ngIf="isSidebarOpen()" class="mr-3.5 font-semibold text-sm relative z-10 animate-fade-in">{{ item.label
          }}</span>

        <!-- Active left border indicator -->
        <div
          class="nav-indicator absolute right-0 top-2 bottom-2 w-0.5 rounded-full bg-primary-400 opacity-0 transition-opacity duration-200">
        </div>
      </a>
    </nav>

    <!-- Logout -->
    <div class="p-3 flex-shrink-0" style="border-top: 1px solid rgba(51,65,85,0.4);">
      <button (click)="logout()"
        class="flex items-center w-full p-3 rounded-xl text-dark-500 hover:text-red-400 hover:bg-red-500/8 transition-all duration-200 group">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        <span *ngIf="isSidebarOpen()" class="mr-3.5 font-semibold text-sm animate-fade-in">تسجيل الخروج</span>
      </button>
    </div>
  </aside>

  <!-- ── Main Content ────────────────────────────────────── -->
  <main class="flex-1 min-w-0 w-full transition-all duration-300 flex flex-col">

    <!-- Top Header -->
    <header class="h-16 lg:h-18 flex items-center justify-between px-4 lg:px-6 sticky top-0 z-20 flex-shrink-0"
      style="background: rgba(7,13,26,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(51,65,85,0.4);">

      <div class="flex items-center gap-3">
        <button (click)="toggleSidebar()"
          class="p-2 rounded-lg text-dark-500 hover:text-white hover:bg-dark-800 transition-all duration-200">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7" />
          </svg>
        </button>

        <!-- Breadcrumb -->
        <div class="hidden sm:flex items-center gap-2">
          <span class="text-dark-600 text-xs">نظام إدارة المركز</span>
          <svg class="w-3 h-3 text-dark-700 rotate-180" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
          <span class="text-dark-300 text-xs font-medium">لوحة التحكم</span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Notifications button -->
        <button class="p-2 rounded-lg text-dark-500 hover:text-white hover:bg-dark-800 transition-all relative">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
          <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-primary-400 rounded-full animate-pulse"></span>
        </button>

        <!-- Profile -->
        <div class="relative">
          <button (click)="toggleProfile()"
            class="flex items-center gap-2.5 px-2.5 py-1.5 rounded-xl border transition-all duration-200"
            style="background: rgba(30,41,59,0.6); border-color: rgba(51,65,85,0.6);">
            <div
              class="w-7 h-7 rounded-lg bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center text-white font-bold text-xs shadow-lg uppercase">
              {{ (authService.currentUser()?.userName || 'م').charAt(0) }}
            </div>
            <div class="hidden md:block text-right">
              <div class="text-xs font-semibold text-dark-200 leading-tight">{{ authService.currentUser()?.fullName ||
                'المستخدم' }}</div>
              <div class="text-[10px] text-dark-500 leading-tight">{{ authService.userRoles()[0] || 'User' }}</div>
            </div>
            <svg class="w-3.5 h-3.5 text-dark-500 hidden md:block transition-transform"
              [class.rotate-180]="isProfileOpen()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <div *ngIf="isProfileOpen()"
            class="absolute left-0 mt-2 w-48 rounded-2xl shadow-2xl py-1 animate-scale-in z-50"
            style="background: #111827; border: 1px solid rgba(51,65,85,0.7);">
            <div class="px-4 py-3 border-b" style="border-color: rgba(51,65,85,0.5);">
              <div class="text-sm font-semibold text-white">{{ authService.currentUser()?.fullName || 'المستخدم' }}
              </div>
              <div class="text-xs text-dark-500">{{ authService.userRoles().join(', ') || 'User' }}</div>
            </div>
            <a href="#"
              class="flex items-center gap-2.5 px-4 py-2.5 text-sm text-dark-300 hover:bg-dark-800 hover:text-white transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              الملف الشخصي
            </a>
            <hr style="border-color: rgba(51,65,85,0.5);" class="my-1">
            <button (click)="logout()"
              class="flex items-center gap-2.5 w-full px-4 py-2.5 text-sm text-red-400 hover:bg-red-500/10 transition-colors">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
              </svg>
              تسجيل الخروج
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <div class="flex-1 p-4 lg:p-7 pb-8 overflow-auto">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>

<style>
  /* Nav link active state */
  .nav-link.is-active {
    background: linear-gradient(135deg, rgba(74, 222, 128, 0.1) 0%, rgba(34, 197, 94, 0.05) 100%);
    border-color: rgba(74, 222, 128, 0.15);
    color: #4ade80;
  }

  .nav-link.is-active .nav-glow {
    opacity: 1;
  }

  .nav-link.is-active .nav-indicator {
    opacity: 1;
  }

  .nav-link:hover:not(.is-active) {
    background: rgba(30, 41, 59, 0.5);
    border-color: rgba(51, 65, 85, 0.4);
    color: #e2e8f0;
  }

  header {
    height: 64px;
  }

  @media (min-width: 1024px) {
    header {
      height: 68px;
    }
  }
</style>
