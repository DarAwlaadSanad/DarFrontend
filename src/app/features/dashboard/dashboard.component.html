<div class="min-h-screen bg-dark-950 flex" dir="rtl">

  <!-- ── Mobile Overlay ─────────────────────────────────────────────────────── -->
  <div *ngIf="isSidebarOpen() && isMobile()"
       (click)="toggleSidebar()"
       class="fixed inset-0 bg-black/60 z-20 lg:hidden backdrop-blur-sm">
  </div>

  <!-- ── Sidebar ─────────────────────────────────────────────────────────────
       Mobile:  fixed right-0, hidden off-screen (translate-x-full) when closed
       Desktop: fixed right-0, always visible, width toggles 72/20
  ─────────────────────────────────────────────────────────────────────────── -->
  <aside
    class="lg:sticky fixed top-0 bottom-0 right-0 z-30 bg-dark-900 border-l border-dark-800 flex flex-col h-screen transition-all duration-300 flex-shrink-0"
    [class.w-72]="isSidebarOpen()"
    [class.w-20]="!isSidebarOpen() && !isMobile()"
    [class.w-72]="isSidebarOpen() && isMobile()"
    [class.translate-x-full]="!isSidebarOpen() && isMobile()"
    [class.translate-x-0]="isSidebarOpen() || !isMobile()"
  >
    <!-- Logo -->
    <div class="h-16 lg:h-20 flex items-center px-4 border-b border-dark-800 overflow-hidden flex-shrink-0">
      <img src="assets/logo.png" alt="كُتّاب" class="w-9 h-9 min-w-[36px] object-contain">
      <span *ngIf="isSidebarOpen()" class="mr-3 text-xl font-bold text-white whitespace-nowrap">كُتّاب</span>
    </div>

    <!-- Nav -->
    <nav class="p-3 space-y-1 flex-1 overflow-y-auto">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.route"
        routerLinkActive="bg-primary-600/10 text-primary-400 border-primary-500/50"
        class="flex items-center p-3 rounded-xl text-dark-400 hover:bg-dark-800 hover:text-white transition-all group border border-transparent"
      >
        <div class="w-5 h-5 flex items-center justify-center flex-shrink-0">
          <svg *ngIf="item.icon === 'home'"         class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          <svg *ngIf="item.icon === 'book'"         class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
          <svg *ngIf="item.icon === 'users'"        class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          <svg *ngIf="item.icon === 'check-square'" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
          <svg *ngIf="item.icon === 'file-text'"    class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          <svg *ngIf="item.icon === 'shield-lock'"  class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016zM12 9v2m0 4h.01"/></svg>
        </div>
        <span *ngIf="isSidebarOpen()" class="mr-4 font-medium text-sm">{{ item.label }}</span>
      </a>
    </nav>

    <!-- Logout -->
    <div class="p-3 border-t border-dark-800 flex-shrink-0">
      <button (click)="logout()" class="flex items-center w-full p-3 rounded-xl text-red-400 hover:bg-red-500/10 transition-all">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span *ngIf="isSidebarOpen()" class="mr-4 font-medium text-sm">تسجيل الخروج</span>
      </button>
    </div>
  </aside>

  <!-- ── Main Content ────────────────────────────────────────────────────────
       Mobile:  no right padding (sidebar overlays)
       Desktop: right padding = sidebar width
  ─────────────────────────────────────────────────────────────────────────── -->
  <main class="flex-1 min-w-0 w-full transition-all duration-300">

    <!-- Top Navbar -->
    <header class="h-16 lg:h-20 bg-dark-900 border-b border-dark-800 flex items-center justify-between px-4 lg:px-6 sticky top-0 z-20">
      <div class="flex items-center gap-3">
        <button (click)="toggleSidebar()" class="p-2 rounded-lg bg-dark-800 text-dark-400 hover:text-white transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
        </button>
        <h2 class="text-base lg:text-lg font-semibold text-white hidden sm:block">نظام إدارة المركز</h2>
      </div>

      <div class="flex items-center gap-2 lg:gap-4">
        <!-- Notifications -->
        <button class="p-2 rounded-lg bg-dark-800 text-dark-400 hover:text-white transition-colors relative">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
          <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-primary-500 rounded-full border border-dark-900"></span>
        </button>

        <!-- Profile -->
        <div class="relative">
          <button (click)="toggleProfile()" class="flex items-center gap-2 p-1.5 rounded-xl bg-dark-800 border border-dark-700 hover:border-dark-600 transition-all">
            <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-primary-600 to-primary-700 flex items-center justify-center text-white font-bold text-xs">م</div>
            <span class="text-xs font-medium text-dark-200 hidden md:block">المشرف</span>
            <svg class="w-4 h-4 text-dark-500 hidden md:block" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div *ngIf="isProfileOpen()" class="absolute left-0 mt-2 w-44 bg-dark-800 border border-dark-700 rounded-xl shadow-2xl py-2 animate-fade-in z-50">
            <a href="#" class="block px-4 py-2 text-sm text-dark-300 hover:bg-dark-700 hover:text-white transition-colors">الملف الشخصي</a>
            <a href="#" class="block px-4 py-2 text-sm text-dark-300 hover:bg-dark-700 hover:text-white transition-colors">الإعدادات</a>
            <hr class="my-2 border-dark-700">
            <button (click)="logout()" class="block w-full text-right px-4 py-2 text-sm text-red-400 hover:bg-red-500/10 transition-colors">تسجيل الخروج</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <div class="p-4 lg:p-8 pb-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
