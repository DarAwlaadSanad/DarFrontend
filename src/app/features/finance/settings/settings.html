<div class="space-y-7 animate-fade-in" dir="rtl">

  <!-- Page Header -->
  <div class="flex items-start justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <div class="w-8 h-8 rounded-lg bg-yellow-500/15 flex items-center justify-center">
          <svg class="w-4 h-4 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </div>
        <h1 class="text-2xl lg:text-3xl font-bold text-white">الإعدادات المالية</h1>
      </div>
      <p class="text-dark-400 text-sm mr-10">ضبط قواعد الخصم والمكافأة التلقائية للموظفين</p>
    </div>
  </div>

  <!-- Success / Error Messages -->
  <div *ngIf="successMessage"
       class="flex items-center gap-3 p-4 rounded-xl bg-primary-500/10 border border-primary-500/20 text-primary-300 animate-fade-in">
    <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
    </svg>
    <span class="text-sm font-medium">{{ successMessage }}</span>
  </div>

  <div *ngIf="errorMessage"
       class="flex items-center gap-3 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-300 animate-fade-in">
    <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span class="text-sm font-medium">{{ errorMessage }}</span>
  </div>

  <!-- Settings Card -->
  <div class="card p-6 max-w-2xl">
    <form [formGroup]="settingsForm" (ngSubmit)="onSubmit()" class="space-y-6">

      <div class="space-y-2">
        <label class="label">قيمة الخصم لكل تأخير (ثابت) <span class="text-red-400">*</span></label>
        <div class="relative">
          <input type="number" formControlName="delayDeductionAmount" class="input-field" placeholder="0"/>
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-dark-400 text-sm">ج.م</span>
        </div>
        <p class="text-xs text-dark-500">يُخصم هذا المبلغ من راتب الموظف لكل حادثة تأخير مسجلة في الشهر.</p>
      </div>

      <div class="space-y-2">
        <label class="label">قيمة الخصم والمكافأة لحصة الغياب / الاحتياطي <span class="text-red-400">*</span></label>
        <div class="relative">
          <input type="number" formControlName="absenceSessionDeduction" class="input-field" placeholder="0"/>
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-dark-400 text-sm">ج.م</span>
        </div>
        <div class="flex items-start gap-2 p-3 rounded-xl bg-dark-800/50 border border-dark-700 mt-2">
          <svg class="w-4 h-4 text-yellow-400 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
          <p class="text-xs text-dark-400">هذا المبلغ سيتم خصمه من المعلم الغائب وإضافته تلقائياً للمعلم البديل عن كل حصة ينوب فيها.</p>
        </div>
      </div>

      <div class="pt-2">
        <button type="submit" [disabled]="settingsForm.invalid" class="btn-primary w-full py-3 text-base">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
          حفظ الإعدادات
        </button>
      </div>
    </form>
  </div>

</div>
