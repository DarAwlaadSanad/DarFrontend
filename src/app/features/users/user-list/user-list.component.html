<div class="space-y-6 animate-fade-in" dir="rtl">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-white mb-1">إدارة المستخدمين</h1>
      <p class="text-dark-400 text-sm">عرض الصلاحيات والتحكم في حسابات المركز</p>
    </div>
  </div>

  <div *ngIf="isLoading()" class="flex justify-center py-20">
    <div class="w-10 h-10 border-4 border-primary-500/20 border-t-primary-500 rounded-full animate-spin"></div>
  </div>

  <div *ngIf="!isLoading()" class="glass-card overflow-hidden border-dark-800">
    <div class="overflow-x-auto">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="bg-dark-800/50 text-dark-300 text-sm">
            <th class="px-6 py-4 font-semibold text-right">المستخدم</th>
            <th class="px-6 py-4 font-semibold text-right">البريد الإلكتروني</th>
            <th class="px-6 py-4 font-semibold text-right">الصلاحيات</th>
            <th class="px-6 py-4 font-semibold text-center">الإجراءات</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-dark-800">
          <tr *ngFor="let user of users()" class="hover:bg-dark-800/30 transition-colors">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-dark-700 flex items-center justify-center text-dark-300 font-bold">
                  {{ user.fullName.charAt(0) }}
                </div>
                <div>
                  <h4 class="text-white font-medium">{{ user.fullName }}</h4>
                  <p class="text-dark-500 text-xs">{{ user.userName }}</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4 text-dark-300 text-sm">
              {{ user.email }}
            </td>
            <td class="px-6 py-4">
              <div class="flex flex-wrap gap-2">
                <span 
                  *ngFor="let role of user.roles"
                  [class]="getRoleBadgeClass(role)"
                  class="px-2.5 py-0.5 rounded-full text-[10px] font-bold border"
                >
                  {{ role }}
                </span>
              </div>
            </td>
            <td class="px-6 py-4 text-center">
              <button class="p-2 text-dark-500 hover:text-white transition-colors">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" /></svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
