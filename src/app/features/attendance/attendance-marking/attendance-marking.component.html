<div class="space-y-6 animate-fade-in" dir="rtl">
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-white mb-1">تسجيل الحضور اليومي</h1>
      <p class="text-dark-400 text-sm">حدد الطلاب الحاضرين والغائبين لليوم</p>
    </div>

    <div class="flex items-center gap-3">
      <input 
        type="date" 
        [ngModel]="selectedDate()" 
        (ngModelChange)="selectedDate.set($event)"
        class="input-field py-2 px-4 w-auto"
      >
      <button 
        (click)="saveAttendance()" 
        [disabled]="isSaving() || isLoading()"
        class="btn-primary py-2 px-6"
      >
        <svg *ngIf="isSaving()" class="w-4 h-4 animate-spin ml-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
        <span>حفظ الحضور</span>
      </button>
    </div>
  </div>

  <!-- Search and Filters -->
  <div class="glass-card p-4 border-dark-800 flex items-center gap-4">
    <div class="relative flex-1">
      <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-dark-500">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </div>
      <input 
        type="text" 
        [ngModel]="searchQuery()" 
        (ngModelChange)="searchQuery.set($event)"
        placeholder="بحث باسم الطالب أو الحلقة..." 
        class="input-field pr-12 py-2"
      >
    </div>
  </div>

  <!-- Success Message -->
  <div *ngIf="message()" class="p-4 rounded-xl bg-green-500/10 border border-green-500/30 text-green-400 text-sm flex items-center gap-3 animate-fade-in">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
    <span>{{ message() }}</span>
  </div>

  <!-- Student List Table -->
  <div class="glass-card overflow-hidden border-dark-800">
    <div class="overflow-x-auto">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="bg-dark-800/50 text-dark-300 text-sm uppercase">
            <th class="px-6 py-4 font-semibold">الطالب</th>
            <th class="px-6 py-4 font-semibold">المستوى / الحلقة</th>
            <th class="px-6 py-4 font-semibold text-center">الحالة</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-dark-800">
          <tr *ngFor="let student of filteredStudents()" class="hover:bg-dark-800/30 transition-colors group">
            <td class="px-6 py-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-dark-700 flex items-center justify-center text-dark-300 group-hover:bg-primary-600/20 group-hover:text-primary-400 transition-colors">
                  {{ student.fullName.charAt(0) }}
                </div>
                <div>
                  <h4 class="text-white font-medium">{{ student.fullName }}</h4>
                  <p class="text-dark-500 text-xs">رقم الطالب: {{ student.id }}</p>
                </div>
              </div>
            </td>
            <td class="px-6 py-4">
              <span class="text-dark-300 text-sm">{{ student.level }}</span>
              <span class="mx-2 text-dark-600">|</span>
              <span class="text-dark-400 text-xs">{{ student.group }}</span>
            </td>
            <td class="px-6 py-4">
              <div class="flex items-center justify-center gap-2">
                <!-- Present -->
                <button 
                  (click)="setStatus(student.id, 'Present')"
                  [class]="attendanceMap()[student.id] === 'Present' ? 'bg-green-600 text-white shadow-lg shadow-green-900/20' : 'bg-dark-800 text-dark-500 hover:bg-dark-700'"
                  class="p-2 rounded-xl transition-all duration-200 flex flex-col items-center gap-1 min-w-[70px]"
                >
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
                  <span class="text-[10px] font-bold">حاضر</span>
                </button>
                
                <!-- Absent -->
                <button 
                  (click)="setStatus(student.id, 'Absent')"
                  [class]="attendanceMap()[student.id] === 'Absent' ? 'bg-red-600 text-white shadow-lg shadow-red-900/20' : 'bg-dark-800 text-dark-500 hover:bg-dark-700'"
                  class="p-2 rounded-xl transition-all duration-200 flex flex-col items-center gap-1 min-w-[70px]"
                >
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
                  <span class="text-[10px] font-bold">غائب</span>
                </button>
                
                <!-- Late -->
                <button 
                  (click)="setStatus(student.id, 'Late')"
                  [class]="attendanceMap()[student.id] === 'Late' ? 'bg-gold-600 text-white shadow-lg shadow-gold-900/20' : 'bg-dark-800 text-dark-500 hover:bg-dark-700'"
                  class="p-2 rounded-xl transition-all duration-200 flex flex-col items-center gap-1 min-w-[70px]"
                >
                  <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  <span class="text-[10px] font-bold">متأخر</span>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
