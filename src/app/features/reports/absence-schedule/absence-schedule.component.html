<div class="space-y-6 animate-fade-in" dir="rtl">
  <div class="flex items-center justify-between no-print">
    <div>
      <h1 class="text-2xl font-bold text-white mb-1">جدول الغياب</h1>
      <p class="text-dark-400 text-sm">عرض وتحميل تقارير غياب الطلاب</p>
    </div>

    <button 
      (click)="printReport()" 
      class="btn-secondary py-2 px-6"
    >
      <svg class="w-5 h-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
      <span>طباعة التقرير</span>
    </button>
  </div>

  <!-- Filters -->
  <div class="glass-card p-6 border-dark-800 space-y-4 no-print">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div>
        <label class="label">من تاريخ</label>
        <input 
          type="date" 
          [ngModel]="startDate()" 
          (ngModelChange)="startDate.set($event)"
          class="input-field py-2"
        >
      </div>
      <div>
        <label class="label">إلى تاريخ</label>
        <input 
          type="date" 
          [ngModel]="endDate()" 
          (ngModelChange)="endDate.set($event)"
          class="input-field py-2"
        >
      </div>
      <div class="flex items-end">
        <button 
          (click)="generateReport()" 
          [disabled]="isLoading()"
          class="btn-primary w-full py-2"
        >
          <svg *ngIf="isLoading()" class="w-4 h-4 animate-spin ml-2" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
          توليد التقرير
        </button>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="glass-card p-4 border-dark-800 no-print">
    <input 
      type="text" 
      [ngModel]="searchQuery()" 
      (ngModelChange)="searchQuery.set($event)"
      placeholder="بحث باسم الطالب..." 
      class="input-field py-2"
    >
  </div>

  <!-- Report Content -->
  <div class="glass-card border-dark-800 overflow-hidden print:shadow-none print:border-none">
    <div class="p-8 hidden print:block text-center border-b border-dark-800">
      <img src="assets/logo.png" alt="كُتّاب" class="w-20 h-20 mx-auto mb-4">
      <h1 class="text-2xl font-bold text-white">تقرير غياب الطلاب</h1>
      <p class="text-dark-400">الفترة من {{ startDate() }} إلى {{ endDate() }}</p>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-right border-collapse">
        <thead>
          <tr class="bg-dark-800/50 text-dark-300 text-sm">
            <th class="px-6 py-4 font-semibold">اسم الطالب</th>
            <th class="px-6 py-4 font-semibold text-center">عدد أيام الغياب</th>
            <th class="px-6 py-4 font-semibold">التواريخ</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-dark-800">
          <tr *ngFor="let report of filteredReports()" class="hover:bg-dark-800/30 transition-colors">
            <td class="px-6 py-4">
              <span class="text-white font-medium">{{ report.studentName }}</span>
            </td>
            <td class="px-6 py-4 text-center">
              <span class="px-3 py-1 rounded-full bg-red-500/10 text-red-400 font-bold text-sm">
                {{ report.absenceCount }} أيام
              </span>
            </td>
            <td class="px-6 py-4">
              <div class="flex flex-wrap gap-2">
                <span *ngFor="let date of report.dates" class="text-[10px] bg-dark-700 text-dark-300 px-2 py-1 rounded border border-dark-600">
                  {{ date | date:'shortDate' }}
                </span>
              </div>
            </td>
          </tr>
          <tr *ngIf="filteredReports().length === 0">
            <td colspan="3" class="px-6 py-12 text-center text-dark-500">
              لا توجد بيانات غياب للفترة المحددة
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<style>
  @media print {
    .no-print { display: none !important; }
    body { background: white !important; color: black !important; }
    .glass-card { background: white !important; border: 1px solid #eee !important; color: black !important; }
    .text-white { color: black !important; }
    .text-dark-400, .text-dark-300, .text-dark-500 { color: #666 !important; }
    .bg-dark-950, .bg-dark-900, .bg-dark-800 { background: white !important; }
    .bg-red-500\/10 { background: #fee2e2 !important; border: 1px solid #fecaca !important; }
    .text-red-400 { color: #dc2626 !important; }
  }
</style>
