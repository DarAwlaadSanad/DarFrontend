<div class="min-h-screen flex items-center justify-center relative overflow-hidden" dir="rtl">
  <!-- Background -->
  <div class="absolute inset-0 bg-gradient-to-br from-dark-950 via-dark-900 to-primary-950">
    <div class="absolute top-1/4 -right-20 w-96 h-96 bg-primary-600/10 rounded-full blur-3xl animate-float"></div>
    <div class="absolute bottom-1/4 -left-20 w-80 h-80 bg-gold-500/10 rounded-full blur-3xl animate-float" style="animation-delay: 1.5s;"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary-800/5 rounded-full blur-3xl"></div>
    <div class="absolute inset-0 opacity-[0.03]"
         style="background-image: url('data:image/svg+xml,%3Csvg width=&quot;60&quot; height=&quot;60&quot; viewBox=&quot;0 0 60 60&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Cg fill=&quot;none&quot; fill-rule=&quot;evenodd&quot;%3E%3Cg fill=&quot;%2322c55e&quot; fill-opacity=&quot;1&quot;%3E%3Cpath d=&quot;M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z&quot;/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');"></div>
  </div>

  <!-- Register Card -->
  <div class="relative z-10 w-full max-w-md mx-4 animate-slide-up">
    <div class="glass-card p-8 md:p-10">
      <!-- Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-600/20 to-gold-500/20 border border-primary-500/20 mb-5 shadow-lg shadow-primary-900/20">
          <img src="assets/logo.png" alt="كُتّاب" class="w-14 h-14 object-contain">
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">إنشاء حساب جديد</h1>
        <p class="text-dark-400 text-sm">أنشئ حسابك للبدء في إدارة المركز</p>
      </div>

      <!-- Error -->
      <div *ngIf="errorMessage()" class="mb-5 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm flex items-center gap-3 animate-fade-in">
        <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/></svg>
        <span>{{ errorMessage() }}</span>
      </div>
      <div *ngIf="errors().length" class="mb-5 p-4 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm animate-fade-in">
        <ul class="list-disc list-inside space-y-1">
          <li *ngFor="let e of errors()">{{ e }}</li>
        </ul>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" #regForm="ngForm" class="space-y-4">
        <!-- Full Name -->
        <div>
          <label for="fullName" class="label">الاسم الكامل</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
              <svg class="w-5 h-5 text-dark-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg>
            </div>
            <input id="fullName" type="text" name="fullName" [(ngModel)]="model.fullName" required class="input-field pr-12" placeholder="أدخل الاسم الكامل" />
          </div>
        </div>

        <!-- Username -->
        <div>
          <label for="userName" class="label">اسم المستخدم</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
              <svg class="w-5 h-5 text-dark-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
            </div>
            <input id="userName" type="text" name="userName" [(ngModel)]="model.userName" required class="input-field pr-12" placeholder="أدخل اسم المستخدم" autocomplete="username" />
          </div>
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="label">البريد الإلكتروني</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
              <svg class="w-5 h-5 text-dark-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"/></svg>
            </div>
            <input id="email" type="email" name="email" [(ngModel)]="model.email" required class="input-field pr-12" placeholder="أدخل البريد الإلكتروني" autocomplete="email" />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label for="regPassword" class="label">كلمة المرور</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
              <svg class="w-5 h-5 text-dark-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/></svg>
            </div>
            <input id="regPassword" [type]="showPassword() ? 'text' : 'password'" name="password" [(ngModel)]="model.password" required minlength="6" class="input-field pr-12 pl-12" placeholder="أدخل كلمة المرور" autocomplete="new-password" />
            <button type="button" (click)="togglePassword()" class="absolute inset-y-0 left-0 flex items-center pl-4 text-dark-500 hover:text-dark-300 transition-colors">
              <svg *ngIf="!showPassword()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
              <svg *ngIf="showPassword()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label for="confirmPassword" class="label">تأكيد كلمة المرور</label>
          <div class="relative">
            <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none">
              <svg class="w-5 h-5 text-dark-500" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
            </div>
            <input id="confirmPassword" [type]="showConfirm() ? 'text' : 'password'" name="confirmPassword" [(ngModel)]="confirmPassword" required class="input-field pr-12 pl-12" placeholder="أعد إدخال كلمة المرور" autocomplete="new-password" />
            <button type="button" (click)="toggleConfirm()" class="absolute inset-y-0 left-0 flex items-center pl-4 text-dark-500 hover:text-dark-300 transition-colors">
              <svg *ngIf="!showConfirm()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
              <svg *ngIf="showConfirm()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
            </button>
          </div>
          <p *ngIf="passwordMismatch" class="mt-1.5 text-xs text-red-400">كلمتا المرور غير متطابقتين</p>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="!regForm.valid || passwordMismatch || authService.isLoading()" class="btn-primary w-full py-3.5 text-base mt-2">
          <svg *ngIf="authService.isLoading()" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
          <span *ngIf="!authService.isLoading()">إنشاء الحساب</span>
          <span *ngIf="authService.isLoading()">جارٍ إنشاء الحساب...</span>
        </button>
      </form>

      <!-- Footer -->
      <div class="mt-6 text-center">
        <p class="text-dark-400 text-sm">
          لديك حساب بالفعل؟
          <a routerLink="/login" class="text-primary-400 hover:text-primary-300 font-semibold transition-colors mr-1">تسجيل الدخول</a>
        </p>
      </div>
    </div>

    <div class="text-center mt-6">
      <p class="text-dark-600 text-xs">© 2026 كُتّاب — نظام إدارة مراكز تحفيظ القرآن الكريم</p>
    </div>
  </div>
</div>
