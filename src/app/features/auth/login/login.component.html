<div class="min-h-screen flex items-center justify-center relative overflow-hidden" dir="rtl">
  <!-- Animated Background -->
  <div class="absolute inset-0 bg-gradient-to-br from-dark-950 via-dark-900 to-primary-950">
    <!-- Decorative orbs -->
    <div class="absolute top-1/4 -right-20 w-96 h-96 bg-primary-600/10 rounded-full blur-3xl animate-float"></div>
    <div class="absolute bottom-1/4 -left-20 w-80 h-80 bg-gold-500/10 rounded-full blur-3xl animate-float"
      style="animation-delay: 1.5s;"></div>
    <div
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary-800/5 rounded-full blur-3xl">
    </div>

    <!-- Geometric pattern overlay -->
    <div class="absolute inset-0 opacity-[0.03]"
      style="background-image: url('data:image/svg+xml,%3Csvg width=&quot;60&quot; height=&quot;60&quot; viewBox=&quot;0 0 60 60&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E%3Cg fill=&quot;none&quot; fill-rule=&quot;evenodd&quot;%3E%3Cg fill=&quot;%2322c55e&quot; fill-opacity=&quot;1&quot;%3E%3Cpath d=&quot;M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z&quot;/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');">
    </div>
  </div>

  <!-- Login Card -->
  <div class="relative z-10 w-full max-w-md mx-4 animate-slide-up">
    <div class="glass-card p-8 md:p-10">
      <!-- Logo & Header -->
      <div class="text-center mb-8">
        <div
          class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-600/20 to-gold-500/20 border border-primary-500/20 mb-5 shadow-lg shadow-primary-900/20">
          <img src="assets/logo.png" alt="كُتّاب" class="w-14 h-14 object-contain">
        </div>
        <h1 class="text-3xl font-bold text-white mb-2">مرحباً بك</h1>
        <p class="text-dark-400">سجل دخولك لمتابعة لوحة التحكم</p>
      </div>

      <!-- Mode Selector -->
      <div class="flex p-1 bg-dark-800 rounded-2xl mb-8">
        <button (click)="loginMode.set('staff')" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all"
          [class.bg-primary-600]="loginMode() === 'staff'" [class.text-white]="loginMode() === 'staff'"
          [class.text-dark-400]="loginMode() !== 'staff'">
          موظف / معلم
        </button>
        <button (click)="loginMode.set('student')" class="flex-1 py-2.5 rounded-xl text-sm font-bold transition-all"
          [class.bg-primary-600]="loginMode() === 'student'" [class.text-white]="loginMode() === 'student'"
          [class.text-dark-400]="loginMode() !== 'student'">
          طالب
        </button>
      </div>

      <!-- Form -->
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="space-y-6">
        <!-- Error Message -->
        <div *ngIf="errorMessage()" class="p-4 bg-red-500/10 border border-red-500/50 rounded-2xl animate-shake">
          <p class="text-red-400 text-sm text-center font-medium">{{ errorMessage() }}</p>
        </div>

        <!-- Staff Username -->
        <div *ngIf="loginMode() === 'staff'">
          <label class="label mb-2 block">اسم المستخدم</label>
          <div class="relative group">
            <div
              class="absolute inset-y-0 right-0 flex items-center pr-4 text-dark-500 group-focus-within:text-primary-400 transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input type="text" name="username" [(ngModel)]="model.userName" required class="input-field pr-12 pl-4"
              placeholder="أدخل اسم المستخدم" autocomplete="username" />
          </div>
        </div>

        <!-- Student Code -->
        <div *ngIf="loginMode() === 'student'">
          <label class="label mb-2 block">كود الطالب</label>
          <div class="relative group">
            <div
              class="absolute inset-y-0 right-0 flex items-center pr-4 text-dark-500 group-focus-within:text-primary-400 transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4" />
              </svg>
            </div>
            <input type="text" name="code" [(ngModel)]="studentModel.code" required class="input-field pr-12 pl-4"
              placeholder="أدخل كود الطالب" autocomplete="username" />
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="label mb-2 block">كلمة المرور</label>
          <div class="relative group">
            <div
              class="absolute inset-y-0 right-0 flex items-center pr-4 text-dark-500 group-focus-within:text-primary-400 transition-colors">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                  d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
              </svg>
            </div>
            <!-- Staff Password -->
            <input *ngIf="loginMode() === 'staff'" [type]="showPassword() ? 'text' : 'password'" name="password"
              [(ngModel)]="model.password" required class="input-field pr-12 pl-12" placeholder="أدخل كلمة المرور"
              autocomplete="current-password" />
            <!-- Student Password -->
            <input *ngIf="loginMode() === 'student'" [type]="showPassword() ? 'text' : 'password'" name="password"
              [(ngModel)]="studentModel.password" required class="input-field pr-12 pl-12"
              placeholder="أدخل كلمة المرور" autocomplete="current-password" />
            <button type="button" (click)="togglePassword()"
              class="absolute inset-y-0 left-0 flex items-center pl-4 text-dark-500 hover:text-dark-300 transition-colors">
              <svg *ngIf="!showPassword()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
              </svg>
              <svg *ngIf="showPassword()" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" [disabled]="!loginForm.valid || isLoading()"
          class="btn-primary w-full py-3.5 text-base mt-2">
          <svg *ngIf="isLoading()" class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
          </svg>
          <span *ngIf="!isLoading()">تسجيل الدخول</span>
          <span *ngIf="isLoading()">جارٍ تسجيل الدخول...</span>
        </button>
      </form>

      <!-- Footer -->
      <div class="mt-8 text-center">
        <p class="text-dark-400 text-sm">
          ليس لديك حساب؟
          <a routerLink="/register"
            class="text-primary-400 hover:text-primary-300 font-semibold transition-colors mr-1">إنشاء حساب جديد</a>
        </p>
      </div>
    </div>

    <!-- Bottom brand -->
    <div class="text-center mt-6">
      <p class="text-dark-600 text-xs">© 2026 كُتّاب — نظام إدارة مراكز تحفيظ القرآن الكريم</p>
    </div>
  </div>
</div>
