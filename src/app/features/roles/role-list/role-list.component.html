<div class="space-y-7 animate-fade-in" dir="rtl">

  <!-- Page Header -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <div class="flex items-center gap-2 mb-1">
        <div class="w-8 h-8 rounded-lg bg-primary-500/15 flex items-center justify-center">
          <svg class="w-4 h-4 text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
          </svg>
        </div>
        <h1 class="text-2xl lg:text-3xl font-bold text-white">إدارة الأدوار والصلاحيات</h1>
      </div>
      <p class="text-dark-400 text-sm mr-10">إنشاء وتعديل أدوار المستخدمين وتخصيص صلاحياتهم</p>
    </div>
    <button (click)="createRole()" class="btn-primary">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      دور جديد
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="roleService.isLoading()" class="py-20 flex flex-col items-center gap-3">
    <div class="w-10 h-10 border-2 border-primary-500/30 border-t-primary-500 rounded-full animate-spin"></div>
    <span class="text-dark-400 text-sm">جاري جلب الأدوار...</span>
  </div>

  <!-- Roles Table -->
  <div *ngIf="!roleService.isLoading()" class="card overflow-hidden">
    <div class="px-5 py-4 flex items-center justify-between" style="border-bottom: 1px solid rgba(51,65,85,0.5);">
      <h3 class="font-bold text-white text-sm">الأدوار المسجلة</h3>
      <span class="badge-gray">{{ roleService.roles().length }} دور</span>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr style="background: rgba(30,41,59,0.5);">
            <th class="px-4 py-3.5 text-right text-xs font-semibold text-dark-400">الدور</th>
            <th class="px-4 py-3.5 text-right text-xs font-semibold text-dark-400">عدد الصلاحيات</th>
            <th class="px-4 py-3.5 text-center text-xs font-semibold text-dark-400">إجراءات</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let role of roleService.roles()"
              class="border-t transition-colors hover:bg-dark-800/30"
              style="border-color: rgba(51,65,85,0.3);">
            <td class="px-4 py-3.5">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-xl bg-primary-500/10 flex items-center justify-center flex-shrink-0">
                  <svg class="w-4 h-4 text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                  </svg>
                </div>
                <span class="font-semibold text-dark-100">{{ role.name }}</span>
              </div>
            </td>
            <td class="px-4 py-3.5">
              <span class="badge-green">{{ role.permissions.length }} صلاحية</span>
            </td>
            <td class="px-4 py-3.5">
              <div class="flex items-center justify-center gap-2">
                <button (click)="editRole(role)"
                        class="w-8 h-8 rounded-lg bg-dark-800 text-dark-400 hover:text-primary-400 hover:bg-primary-500/10 flex items-center justify-center transition-all"
                        title="تعديل">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                  </svg>
                </button>
                <button *ngIf="role.name !== 'Admin'"
                        (click)="deleteRole(role.id)"
                        class="w-8 h-8 rounded-lg bg-dark-800 text-dark-400 hover:text-red-400 hover:bg-red-500/10 flex items-center justify-center transition-all"
                        title="حذف">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>
