<div class="space-y-6 animate-fade-in" dir="rtl">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-white mb-1">قائمة الطلاب</h1>
      <p class="text-dark-400 text-sm">إدارة بيانات طلاب المركز وحلقاتهم</p>
    </div>

    <button 
      (click)="addStudent()" 
      class="btn-primary py-2 px-6"
    >
      <svg class="w-5 h-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
      <span>إضافة طالب</span>
    </button>
  </div>

  <!-- Search -->
  <div class="glass-card p-4 border-dark-800">
    <div class="relative">
      <div class="absolute inset-y-0 right-0 flex items-center pr-4 pointer-events-none text-dark-500">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </div>
      <input 
        type="text" 
        [ngModel]="searchQuery()" 
        (ngModelChange)="searchQuery.set($event)"
        placeholder="بحث باسم الطالب، الحلقة، أو المستوى..." 
        class="input-field pr-12 py-2"
      >
    </div>
  </div>

  <!-- Student Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let student of filteredStudents()" class="glass-card p-6 border-dark-800 hover:border-primary-500/30 transition-all group">
      <div class="flex items-start justify-between mb-4">
        <div class="w-12 h-12 rounded-2xl bg-dark-800 flex items-center justify-center text-primary-400 group-hover:bg-primary-600 group-hover:text-white transition-all">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        </div>
        <div class="flex gap-2">
           <button class="p-2 text-dark-500 hover:text-white transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg></button>
           <button class="p-2 text-dark-500 hover:text-red-400 transition-colors"><svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
        </div>
      </div>
      
      <h3 class="text-white font-bold text-lg mb-1">{{ student.fullName }}</h3>
      <p class="text-dark-400 text-sm mb-4">{{ student.level }} — {{ student.group }}</p>
      
      <div class="pt-4 border-t border-dark-800 flex items-center justify-between">
        <span class="text-dark-500 text-xs">تاريخ الانضمام: {{ student.joiningDate | date:'mediumDate' }}</span>
        <a [routerLink]="['/dashboard/students', student.id]" class="text-primary-400 text-xs font-bold hover:underline flex items-center gap-1">
          عرض التفاصيل
          <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
  </div>

  <div *ngIf="filteredStudents().length === 0" class="glass-card p-12 text-center text-dark-500">
    لا توجد نتائج مطابقة للبحث
  </div>
</div>
