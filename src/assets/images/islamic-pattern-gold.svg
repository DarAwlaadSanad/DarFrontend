<svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .islamic-line {
        fill: none;
        stroke: #f59e0b;
        stroke-width: 1.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0.35;
      }
      .islamic-star {
        fill: #f59e0b;
        fill-opacity: 0.08;
      }
    </style>
  </defs>
  
  <g class="islamic-line">
    <!-- Center 8-pointed star -->
    <polygon class="islamic-star" points="40,24 44.7,35.3 56,40 44.7,44.7 40,56 35.3,44.7 24,40 35.3,35.3" />
    <polygon points="40,24 44.7,35.3 56,40 44.7,44.7 40,56 35.3,44.7 24,40 35.3,35.3" />
    
    <!-- Outer octagram crossing lines -->
    <path d="M40,16 L48,32 L64,40 L48,48 L40,64 L32,48 L16,40 L32,32 Z" />
    
    <!-- Corner stars -->
    <path d="M0,16 L8,8 L16,0" />
    <path d="M0,24 L14,14 L24,0" />
    <polygon class="islamic-star" points="0,0 6,0 10,10 0,6" />
    
    <path d="M80,16 L72,8 L64,0" />
    <path d="M80,24 L66,14 L56,0" />
    <polygon class="islamic-star" points="80,0 74,0 70,10 80,6" />
    
    <path d="M0,64 L8,72 L16,80" />
    <path d="M0,56 L14,66 L24,80" />
    <polygon class="islamic-star" points="0,80 6,80 10,70 0,74" />
    
    <path d="M80,64 L72,72 L64,80" />
    <path d="M80,56 L66,66 L56,80" />
    <polygon class="islamic-star" points="80,80 74,80 70,70 80,74" />
    
    <!-- Connecting ribbons -->
    <line x1="40" y1="16" x2="40" y2="0" />
    <line x1="40" y1="64" x2="40" y2="80" />
    <line x1="16" y1="40" x2="0" y2="40" />
    <line x1="64" y1="40" x2="80" y2="40" />

    <line x1="32" y1="32" x2="14" y2="14" />
    <line x1="48" y1="32" x2="66" y2="14" />
    <line x1="32" y1="48" x2="14" y2="66" />
    <line x1="48" y1="48" x2="66" y2="66" />
  </g>
</svg>
