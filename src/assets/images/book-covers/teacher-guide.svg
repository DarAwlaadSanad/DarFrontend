<svg width="320" height="450" viewBox="0 0 320 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad_teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="goldGrad_teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="spineGrad_teal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.45)"/>
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.08)"/>
    </linearGradient>
  </defs>

  <!-- Book Background -->
  <rect width="320" height="450" rx="14" fill="url(#bgGrad_teal)"/>
  
  <!-- Spine shadow overlay on right for RTL book -->
  <rect x="0" y="0" width="32" height="450" rx="14" fill="url(#spineGrad_teal)"/>

  <!-- Outer Golden Border -->
  <rect x="16" y="16" width="288" height="418" rx="8" fill="none" stroke="url(#goldGrad_teal)" stroke-width="2"/>
  <rect x="22" y="22" width="276" height="406" rx="6" fill="none" stroke="url(#goldGrad_teal)" stroke-width="0.75" opacity="0.7"/>

  <!-- Corner Islamic Ornaments -->
  <g fill="#fde047" opacity="0.85">
    <path d="M290,26 L278,26 L290,38 Z"/>
    <path d="M30,26 L42,26 L30,38 Z"/>
    <path d="M290,424 L278,424 L290,412 Z"/>
    <path d="M30,424 L42,424 L30,412 Z"/>
  </g>

  <!-- Center Decorative Medallion -->
  <circle cx="160" cy="170" r="58" fill="none" stroke="url(#goldGrad_teal)" stroke-width="1.5" stroke-dasharray="4,2"/>
  <circle cx="160" cy="170" r="50" fill="rgba(0,0,0,0.25)" stroke="url(#goldGrad_teal)" stroke-width="1"/>
  
  <!-- Islamic Star Motif in center -->
  <polygon points="160,130 167,153 190,150 173,167 185,188 160,178 135,188 147,167 130,150 153,153" fill="url(#goldGrad_teal)" opacity="0.9"/>

  <!-- Header Bismillah -->
  <text x="160" y="60" fill="#fde047" font-family="Cairo, serif" font-size="12" font-weight="600" text-anchor="middle" opacity="0.9">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</text>

  <!-- Title -->
  <text x="160" y="265" fill="#ffffff" font-family="Cairo, sans-serif" font-size="16" font-weight="800" text-anchor="middle">دَلِيلُ المُعَلِّمِ فِي الحَلَقَاتِ</text>

  <!-- Divider Line -->
  <line x1="80" y1="295" x2="240" y2="295" stroke="url(#goldGrad_teal)" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="160" cy="295" r="3" fill="#fde047"/>

  <!-- Subtitle / Author -->
  <text x="160" y="325" fill="#2dd4bf" font-family="Cairo, sans-serif" font-size="12" font-weight="600" text-anchor="middle">إرشادات وأساليب تحفيظ القرآن</text>

  <!-- Footer Tag -->
  <text x="160" y="398" fill="#fde047" font-family="Cairo, sans-serif" font-size="11" font-weight="700" text-anchor="middle" opacity="0.75">دار أولاد سند لتحفيظ القرآن الكريم</text>
</svg>